services:
  postgres:
    image: postgres:16
    container_name: rabatti-postgres
    environment:
      POSTGRES_DB: rabatti
      POSTGRES_USER: rabatti
      POSTGRES_PASSWORD: rabatti
    ports:
      - "5433:5432"
    volumes:
      - rabatti-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabatti -d rabatti"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rabatti-postgres:
